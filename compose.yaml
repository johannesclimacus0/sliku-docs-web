services:
  frontend:
    image: node:24-bookworm-slim
    profiles: ["frontend"]
    working_dir: /app/frontend
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    environment:
      npm_config_cache: /tmp/npm-cache
      API_PROXY_TARGET: http://nginx
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
      - ./var/docs:/docs-content:ro
    env_file:
      - .env
