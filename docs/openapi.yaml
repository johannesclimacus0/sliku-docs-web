openapi: 3.0.3
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Sign up
      tags:
      - Auth
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
              required:
              - email
              - password
  /auth/login:
    post:
      summary: Sign in
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
                  default: false
              required:
              - email
              - password
  /auth/refresh:
    post:
      summary: Refresh
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      description: Uses the refresh cookie.
  /auth/logout:
    post:
      summary: Logout
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      description: Uses the refresh cookie.
  /auth/me:
    get:
      summary: Current user
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /auth/email/verify:
    post:
      summary: Confirm email
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                token:
                  type: string
                  pattern: ^[a-f0-9]{64}$
              required:
              - userId
              - token
  /auth/email/verification-notification:
    post:
      summary: Resend verification email
      tags:
      - Auth
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /auth/forgot-password:
    post:
      summary: Request password reset
      tags:
      - Auth
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
  /auth/reset-password:
    post:
      summary: Reset password
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                token:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
              required:
              - userId
              - token
              - password
  /auth/avatar:
    post:
      summary: Upload avatar
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required:
              - avatar
    delete:
      summary: Delete avatar
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /users:
    get:
      summary: 'Admin: user list'
      tags:
      - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: search
        in: query
        schema:
          type: string
          maxLength: 80
  /users/{user}:
    get:
      summary: View profile
      tags:
      - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      parameters:
      - name: user
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: Edit profile
      tags:
      - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                bio:
                  type: string
                  maxLength: 500
              required:
              - name
              - bio
      parameters:
      - name: user
        in: path
        required: true
        schema:
          type: integer
  /users/{user}/role:
    patch:
      summary: 'Admin: change role'
      tags:
      - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                  - member
                  - admin
              required:
              - role
      parameters:
      - name: user
        in: path
        required: true
        schema:
          type: integer
  /account/overview:
    get:
      summary: Account overview
      tags:
      - Infrastructure
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /account/operations:
    get:
      summary: 'Admin: service status'
      tags:
      - Infrastructure
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /account/demo/job:
    post:
      summary: 'Queue a demo job (failure mode: admin only)'
      tags:
      - Infrastructure
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                failure:
                  type: boolean
                  default: false
  /account/demo/webhook:
    post:
      summary: 'Admin: send demo webhook'
      tags:
      - Infrastructure
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /account/demo/schedule:
    post:
      summary: 'Admin: run scheduler'
      tags:
      - Infrastructure
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /account/demo/http:
    post:
      summary: 'Admin: try HTTP client'
      tags:
      - Infrastructure
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /health:
    get:
      summary: Check services
      tags:
      - Infrastructure
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
  /health/live:
    get:
      summary: Ping
      tags:
      - Infrastructure
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
      security: []
  /media/avatars/{filename}:
    get:
      summary: Public avatar
      security: []
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}\.(jpg|png|webp)$
      responses:
        '200':
          description: Image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ApiError'
  /account/notifications:
    get:
      summary: Your notifications
      tags:
      - Notifications
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 99999
          default: 1
      - name: unreadOnly
        in: query
        schema:
          type: string
          enum:
          - '0'
          - '1'
          default: '0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserNotification'
                      unreadCount:
                        type: integer
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          perPage:
                            type: integer
                          total:
                            type: integer
        '401': &id001
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /account/notifications/unread-count:
    get:
      summary: Unread count
      tags:
      - Notifications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unreadCount:
                        type: integer
                        minimum: 0
        '401': *id001
  /account/notifications/read-all:
    patch:
      summary: Mark all as read
      tags:
      - Notifications
      requestBody: &id002
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: &id003
                    type: object
                    properties:
                      message:
                        type: string
        '401': *id001
  /account/notifications/{notification}/read:
    patch:
      summary: Mark as read
      tags:
      - Notifications
      parameters:
      - name: notification
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      requestBody: *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *id003
        '401': *id001
        '404':
          $ref: '#/components/responses/ApiError'
  /account/notifications/demo:
    post:
      summary: Send yourself a demo notification
      tags:
      - Notifications
      requestBody: *id002
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      message:
                        type: string
        '401': *id001
        '429':
          $ref: '#/components/responses/ApiError'
  /broadcast/connection:
    get:
      summary: Connect to live updates
      tags:
      - Notifications
      responses:
        '200':
          description: Connection token and channel, if enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - enabled
                    properties:
                      enabled:
                        type: boolean
                      token:
                        type: string
                      url:
                        type: string
                      channel:
                        type: string
                      expiresIn:
                        type: integer
                        example: 300
        '401':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        bio:
          type: string
        role:
          type: string
          enum:
          - member
          - admin
        avatarUrl:
          type: string
          nullable: true
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        emailVerificationRequired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    UserNotification:
      type: object
      required:
      - id
      - type
      - title
      - body
      - data
      - createdAt
      - readAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        type:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: integer
          format: int64
        readAt:
          type: integer
          format: int64
          nullable: true
  responses:
    ApiError:
      description: API error
      content:
